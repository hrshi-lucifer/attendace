{% extends "base.html" %}

{% block content %}
<section class="card">
  <div class="card-header">
    <h2>Attendance for {{ course_code }}</h2>
    <a href="{{ url_for('index') }}" class="link">Change course</a>
  </div>
  {% if students %}
    <form action="{{ url_for('attendance') }}" method="post" class="form">
      <input type="hidden" name="course_code" value="{{ course_code }}">
      <div class="attendance-grid">
        {% for student in students %}
          <label class="attendance-row">
            <input type="checkbox" name="student_ids" value="{{ student.student_id }}">
            <span>{{ student.student_id }}</span>
            <strong>{{ student.full_name }}</strong>
          </label>
        {% endfor %}
      </div>
      <button type="submit" class="button">Save attendance</button>
    </form>
  {% else %}
    <p class="empty">No registered students found for this course code.</p>
  {% endif %}
</section>
{% endblock %}
